<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0C0C0E;--surf:#111116;--surf2:#17171E;--brd:#25252E;
  --acc:#C8B89A;--acc2:#7A6F5E;--txt:#F0EDE6;--muted:#6A6A72;
  --usr:#1C1C26;--green:#27AE60;--red:#C0392B;--r:3px;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'DM Sans',system-ui,sans-serif;
}
body{font-family:var(--sans);background:transparent;overflow:hidden;height:100vh}

/* FAB */
#fab{
  position:fixed;bottom:24px;right:24px;width:54px;height:54px;
  background:var(--acc);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  z-index:1000;transition:transform .2s;
  box-shadow:0 4px 20px rgba(0,0,0,.55);
}
#fab:hover{transform:scale(1.07)}
#fab .na{font-family:var(--serif);font-size:17px;font-weight:400;color:var(--bg)}
#fab .cls{display:none;font-size:19px;font-style:normal;color:var(--bg)}
#fab.open .na{display:none}
#fab.open .cls{display:block}
#fab::before{
  content:'';position:absolute;inset:-7px;
  border:1.5px solid var(--acc);border-radius:0;
  opacity:0;animation:pulse 3s ease-out infinite;
}
@keyframes pulse{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(1.45)}}

/* ACTION BUTTONS */
#actions{
  position:fixed;bottom:88px;right:88px;
  display:flex;flex-direction:column;gap:8px;
  z-index:998;transition:opacity .2s,transform .2s;
}
#actions.hidden{opacity:0;pointer-events:none;transform:translateY(8px)}
.ab{
  display:flex;align-items:center;gap:10px;
  background:var(--bg);border:1px solid var(--brd);
  padding:9px 14px;cursor:pointer;
  transition:border-color .15s,background .15s;
  white-space:nowrap;font-family:var(--sans);
}
.ab:hover{border-color:var(--acc2);background:var(--surf2)}
.ab-icon{
  width:28px;height:28px;background:var(--surf2);
  border:1px solid var(--brd);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.ab-icon svg{width:13px;height:13px;fill:var(--acc)}
.ab-title{display:block;font-size:11.5px;font-weight:500;color:var(--txt)}
.ab-sub{font-size:10px;color:var(--muted);font-weight:300}

/* PANEL */
#panel{
  position:fixed;bottom:88px;right:24px;
  width:370px;max-height:570px;
  background:var(--surf);border:1px solid var(--brd);
  display:flex;flex-direction:column;
  z-index:999;
  transform:translateY(14px) scale(.97);opacity:0;pointer-events:none;
  transition:transform .22s cubic-bezier(.4,0,.2,1),opacity .2s;
  box-shadow:0 8px 48px rgba(0,0,0,.65);
}
#panel.open{transform:translateY(0) scale(1);opacity:1;pointer-events:all}

/* HEADER */
#hdr{
  background:var(--bg);padding:13px 15px 11px;
  display:flex;align-items:center;gap:11px;
  border-bottom:1px solid var(--brd);flex-shrink:0;
}
.hmark{
  width:31px;height:31px;background:var(--acc);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.hmark span{font-family:var(--serif);font-size:13px;color:var(--bg)}
.htxt h2{font-family:var(--serif);font-size:14.5px;font-weight:300;color:var(--txt);letter-spacing:.2px}
.htxt p{font-size:10px;color:var(--muted);margin-top:1px;font-weight:300}
.sdot{width:7px;height:7px;background:#5FC97A;border-radius:50%;margin-left:auto;flex-shrink:0}

/* MESSAGES */
#msgs{
  flex:1;overflow-y:auto;padding:14px 13px 6px;
  display:flex;flex-direction:column;gap:11px;
  scrollbar-width:thin;scrollbar-color:var(--brd) transparent;
}
.msg{display:flex;gap:7px}
.msg.user{flex-direction:row-reverse}
.av{
  width:23px;height:23px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;margin-top:2px;
}
.av.b{background:var(--acc)}
.av.u{background:var(--usr);border:1px solid var(--brd)}
.av span{font-family:var(--serif);font-size:9.5px;color:var(--bg)}
.av.u span{color:var(--muted)}
.bbl{
  font-size:12.5px;line-height:1.65;
  padding:8px 11px;border-radius:var(--r);
  max-width:88%;font-weight:300;
}
.msg.bot .bbl{background:var(--surf2);border:1px solid var(--brd);color:var(--txt)}
.msg.user .bbl{background:var(--usr);border:1px solid #22222C;color:var(--txt)}
.bbl strong{font-weight:500}
.bbl a{color:var(--acc);text-decoration:none}

/* CHIPS */
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.chip{
  font-size:10.5px;color:var(--acc);
  border:1px solid var(--acc2);padding:3px 9px;
  border-radius:var(--r);cursor:pointer;background:transparent;
  transition:background .12s;font-family:var(--sans);
}
.chip:hover{background:rgba(200,184,154,.08)}

/* TYPING */
#typing{display:none;align-items:center;gap:5px;padding-left:30px}
#typing.show{display:flex}
.dot{width:5px;height:5px;border-radius:50%;background:var(--acc2);animation:bb 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
@keyframes bb{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}

/* INPUT */
#ia{border-top:1px solid var(--brd);padding:10px 11px;background:var(--bg);flex-shrink:0}
#ir{display:flex;gap:7px;align-items:flex-end}
#inp{
  flex:1;background:var(--surf2);border:1px solid var(--brd);
  border-radius:var(--r);color:var(--txt);
  font-family:var(--sans);font-size:12.5px;font-weight:300;
  padding:7px 10px;resize:none;outline:none;
  min-height:36px;max-height:86px;line-height:1.5;
  transition:border-color .15s;
}
#inp::placeholder{color:var(--muted)}
#inp:focus{border-color:var(--acc2)}
#sbtn{
  width:34px;height:34px;background:var(--acc);
  border:none;cursor:pointer;border-radius:var(--r);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:opacity .15s;
}
#sbtn:hover{opacity:.85}
#sbtn svg{width:13px;height:13px;fill:var(--bg)}
#disc{font-size:9px;color:var(--muted);text-align:center;margin-top:6px}

@media(max-width:430px){
  #panel{width:calc(100vw - 18px);right:9px;bottom:78px}
  #fab{bottom:14px;right:14px}
  #actions{right:76px;bottom:78px}
}
</style>

let hist=[],open=false;
const panel=document.getElementById('panel');
const fab=document.getElementById('fab');
const msgs=document.getElementById('msgs');
const typing=document.getElementById('typing');
const inp=document.getElementById('inp');
const actions=document.getElementById('actions');

function toggle(){
  open=!open;
  panel.classList.toggle('open',open);
  fab.classList.toggle('open',open);
  actions.classList.toggle('hidden',open);
  if(open) setTimeout(()=>inp.focus(),250);
}

function ctx(c){
  if(!open) toggle();
  const m={
    obra:'¿Qué obras están disponibles ahora?',
    taller:'¿Qué talleres ofrece Natalia y cómo me inscribo?',
    institucional:'Soy galerista y quiero coordinar una consulta sobre obra original.',
  };
  if(m[c]) setTimeout(()=>{inp.value=m[c];send();},300);
}

function chip(t){inp.value=t;send();}
function scroll(){msgs.scrollTop=msgs.scrollHeight;}

function addMsg(role,html){
  const w=document.createElement('div');
  w.className='msg '+role;
  const av=document.createElement('div');
  av.className='av '+(role==='bot'?'b':'u');
  const s=document.createElement('span');
  s.textContent=role==='bot'?'NA':'Tú';
  av.appendChild(s);
  const b=document.createElement('div');
  b.className='bbl';
  b.innerHTML=html;
  w.appendChild(av);w.appendChild(b);
  msgs.insertBefore(w,typing);
  scroll();
}

function fmt(t){
  return t.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
          .replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>');
}

async function send(){
  const t=inp.value.trim();
  if(!t) return;
  inp.value='';inp.style.height='auto';
  addMsg('user',t);
  hist.push({role:'user',content:t});
  typing.classList.add('show');scroll();
  try{
    const API_KEY='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';
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key':API_KEY,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true',
      },
      body:JSON.stringify({
        model:'claude-sonnet-4-6',max_tokens:1000,
        system:SYS.replace('${CATALOG}',CATALOG),
        messages:hist,
      }),
    });
    const d=await res.json();
    const r=d.content?.[0]?.text||'Hubo un problema de conexión. Por favor escríbenos directamente desde la web.';
    typing.classList.remove('show');
    hist.push({role:'assistant',content:r});
    addMsg('bot',fmt(r));
    if(hist.length>20) hist=hist.slice(hist.length-16);
  }catch(e){
    typing.classList.remove('show');
    addMsg('bot','Hubo un problema de conexión. Puedes escribirnos directamente desde natalia-aros.com');
  }
}

inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
inp.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,86)+'px';});
</script>
